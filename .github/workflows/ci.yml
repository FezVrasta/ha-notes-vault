name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tied to the pin in requirements-test.txt: Home Assistant 2026.8 needs 3.14.2+.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-test.txt
      - name: pytest
        run: python -m pytest -q

  translations:
    name: Translations match strings.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # translations/en.json is what Home Assistant actually serves; strings.json is
      # only the source hassfest validates. Letting them drift ships a config flow whose
      # labels are stale, and nothing else catches it.
      - run: |
          for dir in custom_components/*/; do
            diff -u "$dir/strings.json" "$dir/translations/en.json"
          done

  editor:
    name: Editor bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # HACS serves the repository as it is, so the built editor is committed. A
      # change to frontend-src/ without a rebuild ships the old editor.
      - run: npm ci
        working-directory: frontend-src
      - run: npm run build
        working-directory: frontend-src
      - run: git diff --exit-code custom_components/notes_vault/frontend/editor.js

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
